services:
  db:
    image: ankane/pgvector:latest
    container_name: omnipresence-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omnipresence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - omnipresence-network

  redis:
    image: redis:alpine
    container_name: omnipresence-redis
    ports:
      - "6381:6379"
    networks:
      - omnipresence-network

  backend:
    build: ./backend
    container_name: omnipresence-backend
    ports:
      - "3010:3010"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/omnipresence
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434/api/embeddings
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
    networks:
      - omnipresence-network

  frontend:
    build: ./frontend
    container_name: omnipresence-frontend
    ports:
      - "5180:5178"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - omnipresence-network

networks:
  omnipresence-network:
    driver: bridge

volumes:
  postgres_data:
